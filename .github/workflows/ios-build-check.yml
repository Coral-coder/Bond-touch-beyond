# Full compile check (both simulator architectures), with signing disabled, for pull
# requests and by hand. Everyday pushes get the faster ios-quick-build.yml instead, and main
# needs neither: ios-testflight.yml archives (and so compiles) everything from main.
name: iOS build check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "project.yml"
      - "Sources/**"

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch libsignal_ffi (Signal protocol core)
        run: scripts/fetch-libsignal-ffi.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator (no signing)
        run: |
          xcodebuild \
            -project BondTouchBeyond.xcodeproj \
            -scheme BondTouchBeyond \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
