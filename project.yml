name: BondTouchBeyond
options:
  bundleIdPrefix: com.lightwave
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "15"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (avoids iPad icon/orientation requirements)

targets:
  # Signal's LibSignalClient v0.86.5 (AGPL-3.0) — the same Signal-protocol library the
  # original iOS app ships, needed to interoperate with its end-to-end encrypted chat.
  # Swift sources are vendored in ThirdParty/LibSignalClient; the Rust core
  # (libsignal_ffi.a) is fetched by scripts/fetch-libsignal-ffi.sh (SHA-256 pinned).
  LibSignalClient:
    type: framework.static
    platform: iOS
    sources:
      - path: ThirdParty/LibSignalClient/LibSignalClient
    settings:
      base:
        SWIFT_VERSION: "5"
        PRODUCT_BUNDLE_IDENTIFIER: org.signal.libsignal-client
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        HEADER_SEARCH_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        OTHER_SWIFT_FLAGS: -suppress-warnings

  BondTouchBeyond:
    type: application
    platform: iOS
    dependencies:
      - target: LibSignalClient
        link: true
        embed: false
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        # Bind version/build to the build settings so the TestFlight workflow's per-build
        # override (CURRENT_PROJECT_VERSION / MARKETING_VERSION) reaches the archive. Without
        # this, XcodeGen hardcodes CFBundleVersion to "1" and every upload collides.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # XcodeGen generates the Info.plist from these properties, so orientations must be
        # declared here (iPhone-only → portrait is enough) or TestFlight rejects the upload.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only phone app: requiring full screen waives the iPad-multitasking rule
        # that otherwise demands all four orientations (App Store validation code 90474).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # CoreBluetooth usage strings are required or the app is rejected / crashes on first scan.
        NSBluetoothAlwaysUsageDescription: Bond Touch Beyond uses Bluetooth to talk to your bracelet.
        NSBluetoothPeripheralUsageDescription: Bond Touch Beyond uses Bluetooth to talk to your bracelet.
        NSHealthShareUsageDescription: Bond Touch Beyond reads your heart rate so you can send your live heartbeat to your partner's bracelet.
        NSHealthUpdateUsageDescription: Bond Touch Beyond does not write to Health; this permission is required by the HealthKit framework.
        NSLocationWhenInUseUsageDescription: Bond Touch Beyond shows your location on the map so you can share it with your partner.
        NSFaceIDUsageDescription: Bond Touch Beyond uses Face ID to unlock your Private Space.
        UIBackgroundModes:
          - bluetooth-central
          - remote-notification
    entitlements:
      path: Sources/App/BondTouchBeyond.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(CFBundleIdentifier)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: production
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightwave.beyond
        # LibSignalClient imports the SignalFfi C module; the app must see it too, and the
        # final link pulls in the prebuilt Rust core for the SDK/arch being built.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        HEADER_SEARCH_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/ThirdParty/libsignal-ffi/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]": $(SRCROOT)/ThirdParty/libsignal-ffi/target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]": $(SRCROOT)/ThirdParty/libsignal-ffi/target/x86_64-apple-ios/release
        OTHER_LDFLAGS: -lsignal_ffi -lz
