name: BondTouchBeyond
options:
  bundleIdPrefix: com.lightwave
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "59"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (avoids iPad icon/orientation requirements)
    # The app's bundle id; the watch app is "<this>.watchkitapp". The TestFlight workflow
    # overrides APP_BUNDLE_ID (not PRODUCT_BUNDLE_IDENTIFIER, which would hit every target).
    APP_BUNDLE_ID: com.lightwave.beyond

packages:
  # Nordic Semiconductor's DFU library (BSD-3), used to repair a bracelet stuck in update mode.
  NordicDFU:
    url: https://github.com/NordicSemiconductor/IOS-DFU-Library
    exactVersion: 4.15.3

targets:
  # Signal's LibSignalClient v0.86.5 (AGPL-3.0) — the same Signal-protocol library the
  # original iOS app ships, needed to interoperate with its end-to-end encrypted chat.
  # Swift sources are vendored in ThirdParty/LibSignalClient; the Rust core
  # (libsignal_ffi.a) is fetched by scripts/fetch-libsignal-ffi.sh (SHA-256 pinned).
  LibSignalClient:
    type: framework.static
    platform: iOS
    sources:
      - path: ThirdParty/LibSignalClient/LibSignalClient
    settings:
      base:
        SWIFT_VERSION: "5"
        PRODUCT_BUNDLE_IDENTIFIER: org.signal.libsignal-client
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        HEADER_SEARCH_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        OTHER_SWIFT_FLAGS: -suppress-warnings

  BondTouchBeyond:
    type: application
    platform: iOS
    dependencies:
      - target: LibSignalClient
        link: true
        embed: false
      - target: BondTouchBeyondWatch
      - target: BondTouchBeyondNotificationService
      - target: BondTouchBeyondNotificationContent
      - target: BondTouchBeyondWidget
      - package: NordicDFU
    sources:
      - path: Sources
      # Official bracelet firmware (see Firmware/README.md), for automatic DFU recovery.
      - path: Firmware
        buildPhase: resources
        excludes:
          - README.md
          # The decompiled source is for study only, never part of the app.
          - "decompiled/**"
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        # Bind version/build to the build settings so the TestFlight workflow's per-build
        # override (CURRENT_PROJECT_VERSION / MARKETING_VERSION) reaches the archive. Without
        # this, XcodeGen hardcodes CFBundleVersion to "1" and every upload collides.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Required for CloudKit sharing: tells iOS the app accepts CKShare invites, so an
        # invite link routes to userDidAcceptCloudKitShareWith and the share provisions
        # correctly. Without it the invite link is inert and the share sheet can spin.
        CKSharingSupported: true
        # The invite link scheme (bondtouchbeyond://join?code=…) opens the app to join a bond.
        CFBundleURLTypes:
          - CFBundleURLName: com.lightwave.beyond.invite
            CFBundleURLSchemes:
              - bondtouchbeyond
        # XcodeGen generates the Info.plist from these properties, so orientations must be
        # declared here (iPhone-only → portrait is enough) or TestFlight rejects the upload.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only phone app: requiring full screen waives the iPad-multitasking rule
        # that otherwise demands all four orientations (App Store validation code 90474).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # CoreBluetooth usage strings are required or the app is rejected / crashes on first scan.
        NSBluetoothAlwaysUsageDescription: Bond Touch Beyond uses Bluetooth to talk to your bracelet and your Bond Heart pendant.
        NSBluetoothPeripheralUsageDescription: Bond Touch Beyond uses Bluetooth to talk to your bracelet and your Bond Heart pendant.
        # Bond Heart: a heartbeat is recorded with the camera and flash (fingertip on the lens).
        NSCameraUsageDescription: Bond Touch Beyond records your heartbeat with the camera and flash while your fingertip covers them. Nothing is photographed or stored.
        NSHealthShareUsageDescription: Bond Touch Beyond reads your heart rate (and Apple Watch beat-to-beat recordings, for Bond Heart) so you can send your heartbeat to your partner's bracelet or pendant, and your heart-rate variability, resting heart rate and sleep to work out your personal battery, which you can share with your partners.
        NSHealthUpdateUsageDescription: Bond Touch Beyond does not write to Health; this permission is required by the HealthKit framework.
        NSLocationWhenInUseUsageDescription: Bond Touch Beyond keeps running in the background so your partner's touches reach your bracelet while your phone is locked, and shows your location on the map if you share it with your partner.
        NSFaceIDUsageDescription: Bond Touch Beyond uses Face ID to unlock your Private Space.
        UIBackgroundModes:
          - bluetooth-central
          - remote-notification
          - location
        NSLocationAlwaysAndWhenInUseUsageDescription: Bond Touch Beyond keeps running in the background so touches from your partner reach your bracelet while your phone is locked, shares your location with your partner if you turn that on, and tells your partner when you arrive at a place you saved.
        # Open official bracelet firmware (.zip) shared from Files or another app, so a
        # bracelet stuck in update mode can be repaired.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Bracelet firmware
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
        LSSupportsOpeningDocumentsInPlace: false
        # The Keychain group shared with the notification extension (Sources/Shared/SharedBonds.swift).
        BTKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
    entitlements:
      path: Sources/App/BondTouchBeyond.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(CFBundleIdentifier)
        com.apple.developer.icloud-services:
          - CloudKit
        # Production CloudKit. Its schema needs the one record type the relay uses — BTItem with
        # a BYTES field "payload" (cloudkit.ckdb) — imported and deployed to Production.
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: production
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # The app's own group first (where its Keychain items have always lived), then the
        # group shared with the notification extension — no developer-portal setup needed.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID)
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # The original icon stays selectable in Settings → App icon.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconClassic
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # LibSignalClient imports the SignalFfi C module; the app must see it too, and the
        # final link pulls in the prebuilt Rust core for the SDK/arch being built.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        HEADER_SEARCH_PATHS: $(SRCROOT)/ThirdParty/LibSignalClient/SignalFfi
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/ThirdParty/libsignal-ffi/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]": $(SRCROOT)/ThirdParty/libsignal-ffi/target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]": $(SRCROOT)/ThirdParty/libsignal-ffi/target/x86_64-apple-ios/release
        OTHER_LDFLAGS: -lsignal_ffi -lz

  # Apple Watch app: a touch bar and one-tap meanings, relayed through the phone
  # (WatchConnectivity). Embedded in the iOS app.
  BondTouchBeyondWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    dependencies:
      - target: BondTouchBeyondWatchWidget
    sources:
      - path: Watch
      - path: Sources/Models/TouchPattern.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        BTKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        # Stand-in mode keeps the watch app awake as a workout session, so touches play on
        # the wrist the moment they arrive.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Stand-in mode keeps Bond Touch Beyond awake on your watch so your partner's touches play on your wrist as they arrive.
        NSHealthUpdateUsageDescription: Stand-in mode runs as a quiet session on your watch so your partner's touches play on your wrist as they arrive. Nothing is recorded.
    entitlements:
      path: Watch/BondTouchBeyondWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  # The watch-face complication: the last touch received. Reads what the watch app keeps in
  # the shared Keychain group (Watch/Complication.swift). Embedded in the watch app.
  BondTouchBeyondWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: WatchWidget
      - path: Watch/Complication.swift
      - path: Sources/Models/TouchPattern.swift
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BTKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidget/BondTouchBeyondWatchWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  # Widgets (home screen + Lock Screen): meanings to send, the last touch received, days
  # together. They share data with the app through its Keychain group (no App Group, so no
  # developer-portal setup). Embedded in the iOS app.
  BondTouchBeyondWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared/WidgetShared.swift
      - path: Sources/Shared/SendMeaningIntent.swift
      - path: Sources/Models/Weather.swift
      - path: Sources/Design/Theme.swift
      - path: Sources/Design/TouchViz.swift
      - path: Sources/Models/TouchPattern.swift
      - path: Sources/Models/Heartbeat.swift
      - path: Sources/Views/EKGView.swift
      - path: Sources/Views/Color+RGB.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BTKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BondTouchBeyondWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        SKIP_INSTALL: YES
        # Sources/Shared/SendMeaningIntent.swift queues the send instead of calling the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

  # Decrypts a partner's touch push on this phone and makes it a rich notification: the
  # touch's picture, its meaning, and the TOUCH category (long-press replay, watch view).
  BondTouchBeyondNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Sources/Shared/SharedBonds.swift
      - path: Sources/Shared/TouchNotification.swift
      - path: Sources/Cloud/BondCrypto.swift
      - path: Sources/Models/TouchMessage.swift
      - path: Sources/Models/TouchPattern.swift
      - path: Sources/Models/Heartbeat.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BTKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notification-service
        SKIP_INSTALL: YES

  # The long-press view of a touch notification: the touch replays, the phone buzzes its rhythm.
  BondTouchBeyondNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationContent
      - path: Sources/Shared/TouchNotification.swift
      - path: Sources/Models/TouchMessage.swift
      - path: Sources/Models/TouchPattern.swift
      - path: Sources/Models/Heartbeat.swift
      - path: Sources/Views/EKGView.swift
      - path: Sources/Views/Color+RGB.swift
      - path: Sources/Design/Theme.swift
      - path: Sources/Design/TouchViz.swift
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Bond Touch Beyond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: TOUCH
            UNNotificationExtensionInitialContentSizeRatio: 0.6
            UNNotificationExtensionDefaultContentHidden: false
            UNNotificationExtensionUserInteractionEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notification-content
        SKIP_INSTALL: YES
